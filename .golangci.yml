version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: false
      check-blank: true
    goconst:
      min-len: 5
      min-occurrences: 4
      # Count occurrences in the code under test only. Tests name FHIR types
      # constantly — a fixture per type — and counting those reported literals
      # that appear once in the engine and eight times across its table-driven
      # tests, which is not repetition worth naming.
      ignore-tests: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - staticcheck
        path: doc\.go
      - linters:
          - gochecknoinits
        path: funcs/.*\.go
      - linters:
          - gochecknoinits
        path: types/pool\.go
      - linters:
          - gocyclo
        path: types/(datetime|date|time)\.go
      - linters:
          - gocyclo
        path: eval/evaluator\.go
      - linters:
          - gocyclo
        path: funcs/math\.go
      - linters:
          - gocyclo
        path: funcs/fhir\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gofhir
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
